# Cuts a GitHub Release when a release tag is pushed.
#
# Tag format: app-v<version>, e.g. app-v0.1.0-beta.1. The "app-" prefix says which product
# in this repository the tag belongs to; the Pi firmware gets its own prefix when it has
# releases. A version with a pre-release suffix (-beta.1, -rc.1) is published as a
# pre-release; a bare version is a full release.
#
# Structured as one build job per platform feeding a single collecting release job, so
# adding iOS, desktop or web later means adding a job and one line to `needs`, not
# restructuring the pipeline. Only Android is implemented today.
name: App Release

on:
  push:
    tags: ['app-v*']
  # Allows a manual build from any ref; it is published as a pre-release named after the
  # run number, never as a versioned release.
  workflow_dispatch:

concurrency:
  # Releases must not race each other: two concurrent runs would fight over the tag.
  group: release-app
  cancel-in-progress: false

permissions:
  contents: write   # required to create the release

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: app

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/app-v* ]]; then
            V="${GITHUB_REF#refs/tags/app-v}"
            # The tag must agree with the version the app reports about itself.
            CATALOG=$(awk -F'"' '/^openveil = /{print $2; exit}' gradle/libs.versions.toml)
            if [[ "$V" != "$CATALOG" ]]; then
              echo "::error::tag says $V but gradle/libs.versions.toml says $CATALOG"
              exit 1
            fi
          else
            BASE=$(awk -F'"' '/^openveil = /{print $2; exit}' gradle/libs.versions.toml)
            V="${BASE:-0.0.0}-build.${{ github.run_number }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Anything with a suffix (beta, rc, build) is a pre-release.
          if [[ "$V" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Generate development C2PA signing identity
        run: bash tools/generate-dev-cert.sh

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest --no-daemon

      - name: Build Android APK
        # versionCode must rise with every release; the run number does that for free.
        env:
          OPENVEIL_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Verify 16 KB page alignment of native libraries
        run: |
          for apk in androidApp/build/outputs/apk/debug/*.apk; do
            echo "--- $apk"
            python3 tools/check_16kb_alignment.py "$apk"
          done

      - name: Name the artifacts after their version and architecture
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.version }}"
          # One APK per ABI. Most people want arm64-v8a; the rest cover older devices
          # and emulators.
          for apk in androidApp/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$apk" | sed -e 's/^androidApp-//' -e 's/-debug\.apk$//')
            cp "$apk" "dist/openveil-${V}-android-${abi}.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/dist/*.apk
          retention-days: 14

  # --- Not yet implemented. Each becomes a job here and an entry in `release.needs`,
  #     building a further target of the same Gradle project under app/. ---
  # ios:      runs-on: macos-latest   -> .ipa   (needs AVFoundation capture + c2pa-swift)
  # desktop:  runs-on: ubuntu-latest  -> native distributions via Compose Desktop
  # web:      runs-on: ubuntu-latest  -> wasmJs bundle

  release:
    name: Publish release
    needs: [android]
    runs-on: ubuntu-latest
    # Deliberately no working-directory: this job operates on the repository root.
    steps:
      - uses: actions/checkout@v4

      - name: Collect platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ needs.android.outputs.version }}
          name: OpenVeil App ${{ needs.android.outputs.version }}
          prerelease: ${{ needs.android.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
          body: |
            Built from `${{ github.sha }}`.

            **Before you install, two things to know:**

            - The APKs are **debug-signed**, so they are for sideloading only, not for
              Google Play. You may need to uninstall a previous copy first.
            - One APK per architecture. **Most phones need `arm64-v8a`.** The `x86`
              variants exist for emulators.
            - Content Credentials are signed with a **generated development certificate**
              that chains to no recognised authority. Validators will report captures as
              *Valid* but not *Trusted*: the tamper-evidence is real and verifiable, but
              nothing vouches for who signed. See `app/docs/SECURITY.md`.

            Every build is checked for 16 KB page alignment and runs the full unit and
            integration suites, including the NIP-01 event-id, BIP-340 Schnorr, NIP-19
            and NIP-44 vectors.

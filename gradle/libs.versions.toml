[versions]
# Product version. CI appends the run number to form the release tag, so bumping
# this here is the single place a release series is named.
openveil = "0.1.0"
# This set mirrors the combination JetBrains ships in the actively-maintained
# compose-multiplatform/examples/imageviewer project, which is the only reliable signal
# for "AGP 9 + KMP + Compose Multiplatform actually works together".
# Verify against that example before bumping any of kotlin / agp / compose.
kotlin = "2.4.10"
agp = "9.1.1"
compose = "1.11.1"

coroutines = "1.11.0"
serialization = "1.11.0"
kotlinxDatetime = "0.8.0"
ktor = "3.5.1"
# 0.24.0, not 0.17.x: 0.19.0 was the release that rebuilt the Android native libraries
# with 16 KB page alignment (ACINQ/secp256k1-kmp#124). Below that, libsecp256k1-jni.so
# has 4 KB LOAD segments and Play rejects the app for Android 15+.
secp256k1 = "0.24.0"
# 0.0.9, not 1.0.0: the project README advertises 1.0.0 but no such tag exists, and the
# 0.0.10 JitPack build errored. 0.0.9 is the newest version that actually resolves.
c2pa = "0.0.9"

androidxActivity = "1.13.0"
androidxCamera = "1.6.1"

# Android SDK levels. minSdk 28 is the floor imposed by c2pa-android 1.0.0.
androidMinSdk = "28"
androidTargetSdk = "36"
androidCompileSdk = "36"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }

androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# BIP-340 Schnorr signing for Nostr. Genuinely multiplatform (JVM/Android/iOS/Linux);
# the android artifact carries the JNI .so files.
secp256k1 = { module = "fr.acinq.secp256k1:secp256k1-kmp", version.ref = "secp256k1" }
secp256k1-jni-android = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1" }
# Host (JVM) unit tests need the desktop JNI bundle; the android one ships .so for the device only.
secp256k1-jni-jvm = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm", version.ref = "secp256k1" }

# Official Content Authenticity Initiative SDK (JNI over c2pa-rs). Published to
# JitPack, not Maven Central. Requires minSdk 28.
c2pa-android = { module = "com.github.contentauth:c2pa-android", version.ref = "c2pa" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# AGP 9 replaced com.android.library for KMP modules. Using com.android.library together
# with the KMP plugin is a hard error since AGP 9.0.
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

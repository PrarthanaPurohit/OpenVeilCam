[package]
name = "openveil-cam"
version = "0.1.0"
edition = "2021"
description = "Camera operations + Nostr event signing on Raspberry Pi"
authors = ["Prarthana Purohit"]
license = "MIT"
# Two binaries ship from this crate; name the one a bare `cargo run` should
# pick, so the camera app stays the default and `c2pa-bridge` is opt-in.
default-run = "openveil-cam"

[[bin]]
name = "openveil-cam"
path = "src/main.rs"

[dependencies]
# device-signer: hardware-linked secp256k1 key gen + Nostr Schnorr signing
device-signer = "0.1"

# Nostr protocol primitives (event building, kind constants, json serialisation)
nostr = { version = "0.44", features = ["std"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Ergonomic error handling
anyhow = "1"

# SHA-256 for building Nostr event ID hash
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
# Image decoding for NIP-80 `px1` media canonicalization
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# HTTP client (rustls avoids OpenSSL on RPi)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# WebSocket for Nostr relay publishing
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Base64 encoding for Blossom auth header
base64 = "0.22"
c2pa = { version = "0.90.15", features = ["file_io"] }

# C2PA signing identity. The C2PA spec does not permit secp256k1, so the
# credential key is a separate P-256 key derived (via hkdf) from the same
# hardware entropy as the Nostr key. openssl is already in the tree via c2pa;
# it mints the self-signed X.509 cert that key needs.
p256 = { version = "0.13", features = ["pkcs8"] }
hkdf = "0.12"
openssl = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
